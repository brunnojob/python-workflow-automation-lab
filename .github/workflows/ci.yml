name: Test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python -m lab simulate
      - run: python -m lab collect secondary-a --allow-owner secondary-a --demo --per-page 1 --max-pages 1
      - run: python -m lab collect secondary-a --allow-owner secondary-a --demo --per-page 1 --max-pages 5
